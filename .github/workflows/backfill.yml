name: Backfill history

# FR-1.5 / FR-2.8: one-time seeding of October 2015 to the present. Runs
# sequentially with a delay between pages, is resumable (months already
# stored are skipped), and commits its output so it never needs to run twice.
#
# The daily request ceiling is 60, so a full ~135-month backfill takes three
# runs on three days. Re-run this workflow until it reports nothing pending.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First month (YYYY-MM), blank for 2015-10"
        required: false
      limit:
        description: "Max bulletins this run"
        required: false
        default: "55"
      delay:
        description: "Seconds between fetches"
        required: false
        default: "4"

concurrency:
  group: backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Backfill
        run: |
          PYTHONPATH=src python -m vbt.cli backfill \
            ${{ inputs.start && format('--start {0}', inputs.start) || '' }} \
            --limit ${{ inputs.limit }} \
            --delay ${{ inputs.delay }}

      - name: Verify
        if: always()
        run: PYTHONPATH=src python -m vbt.cli verify || true

      - name: Commit
        if: always()
        run: |
          git config user.name  "visa-bulletin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: backfill $(ls data/bulletins/*.json | wc -l) months"
            git push
          fi
