name: Poll Visa Bulletin

# FR-2.1: every 30 minutes during the publication window (the 5th to the
# 20th), limited to roughly 08:00-20:00 US Eastern, plus one daily check the
# rest of the month. GitHub cron is UTC.
# SCHEDULE DISABLED. GitHub's runner IPs get a Cloudflare challenge from
# travel.state.gov (see data/last_run.json and the README), so every
# scheduled run failed before issuing a single request -- and each failure
# opened an issue. Polling now runs from a machine on a residential
# connection via systemd (deploy/install.sh).
#
# Re-enable only if the source stops challenging datacentre IPs.
on:
  workflow_dispatch:

# Never let two polls overlap -- the request ledger is a file, and a race
# would let the daily ceiling be exceeded.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for a new bulletin
        id: poll
        run: PYTHONPATH=src python -m vbt.cli poll

      - name: Verify stored data
        if: steps.poll.outputs.new_bulletin == 'true'
        run: PYTHONPATH=src python -m vbt.cli verify

      - name: Commit data changes
        run: |
          git config user.name  "visa-bulletin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            if [ "${{ steps.poll.outputs.new_bulletin }}" = "true" ]; then
              git commit -m "data: bulletin ${{ steps.poll.outputs.months }}"
            else
              git commit -m "data: poll state $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            git push
          fi

      - name: Summary
        run: |
          {
            echo "### Visa Bulletin poll"
            echo ""
            echo "- New bulletin: \`${{ steps.poll.outputs.new_bulletin }}\`"
            echo "- Months added: \`${{ steps.poll.outputs.months }}\`"
            echo "- Latest stored: \`${{ steps.poll.outputs.latest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # FR-8.2: a scraper or parse failure is itself a notification trigger.
      # P0 surfaces it as a GitHub issue; P2 replaces this with web push.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Visa Bulletin poll failed (run ${context.runId})`,
              body: `The scheduled poll failed. Check the run log:\n\n` +
                    `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                    `/actions/runs/${context.runId}`,
            });
