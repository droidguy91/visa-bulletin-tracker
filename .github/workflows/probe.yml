name: Probe robots.txt

# Diagnostic only. Fetches nothing but robots.txt, which is never itself
# governed by robots.txt, and commits the response so it can be read without
# access to CI log storage.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m vbt.cli probe
      - run: |
          git config user.name  "visa-bulletin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || { git commit -m "diag: robots.txt probe"; git push; }
